name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verifier:
    name: Vérifier le dossier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Vérifier la syntaxe JavaScript
        run: npm run check

      - name: Vérifier que vercel.json est du JSON valide
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Test de fumée
        run: npm test

      - name: Vérifier que dist/ est à jour
        run: |
          node build.js
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ n'est pas à jour. Lancez « npm run bundle » et validez le résultat."
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ est à jour."
