<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feuillet introuvable — Dossier Berkshire T2 2026</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f0e1">
<link rel="stylesheet" href="/assets/css/report.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f4f0e1'/><rect y='18' width='100' height='16' fill='%23d5e3ca'/><rect y='50' width='100' height='16' fill='%23d5e3ca'/><path d='M12 78 L88 26' stroke='%23c0271a' stroke-width='9' fill='none'/></svg>">
<style>
  .lost { text-align: left; max-width: 34rem; }
  .lost__code {
    font-family: var(--mono); font-size: clamp(3.5rem, 2rem + 9vw, 7rem);
    font-weight: 700; color: var(--ink-green); line-height: 1; letter-spacing: -.03em;
  }
  .lost__actions { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2rem; }
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="wobble">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<main class="sheet" style="margin-top:clamp(2rem,8vw,6rem)">
  <div class="sheet__head">
    <span class="sheet__num">✕</span>
    <h2>Feuillet introuvable</h2>
    <span class="stamp">Hors dossier</span>
  </div>

  <div class="lost">
    <p class="lost__code">404</p>
    <p class="lede" style="margin-top:1.2rem">Cette page ne fait pas partie du dossier. Elle a peut-être été déplacée, ou l'adresse comporte une coquille.</p>
    <p class="note">✎ Vérifié : rien à cette référence.</p>

    <p class="lost__actions">
      <a class="btn" href="/">Revenir au dossier</a>
      <a class="btn btn--pencil" href="/#sommaire">Ouvrir le sommaire</a>
    </p>
  </div>
</main>

</body>
</html>
